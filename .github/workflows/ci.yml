name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint en tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          dev: "true"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (opmaak)
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest
